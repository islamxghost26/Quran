name: Build APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: |
          mkdir www && cp index.html sw.js manifest.webmanifest version.json *.png *.jpg www/
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap init "القرآن الكريم" com.quran.app --web-dir www
          npx cap add android && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: quran-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
